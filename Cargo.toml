[package]
name = "rtb"
version = "0.1.0"
edition = "2024"

[lib]
name = "rtb"
path = "src/lib.rs"

[[bin]]
name = "rtb"
path = "src/main.rs"

[dependencies]
arboard = "3.4"
calamine = "0.26"
chrono = "0.4.45"
clap = { version = "4.6.6", features = ["derive"] }
colored = "3.1.1"
crossterm = "0.29.0"
csv = "1.3"
ratatui = "0.30.2"
regex = "1.13.1"
rusqlite = "0.40.2"
rust_xlsxwriter = "0.8"
